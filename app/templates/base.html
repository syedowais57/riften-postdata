<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Traces{% endblock %} · Riften post-training</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">Riften <span>post-training data</span></div>

<div class="wrap">

</div>
</body>
</html>
